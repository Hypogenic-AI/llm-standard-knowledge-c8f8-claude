idea:
  title: How much volume is standard knowledge in LLMs?
  domain: artificial_intelligence
  hypothesis: 'The amount of LLM parameters dedicated to encoding standard categorical
    and conditional knowledge (such as "Peanuts are legumes" or "Georgia is both a
    US state and a country") is a very small component of the total model, but this
    has not yet been quantitatively estimated.

    '
  background:
    description: 'There is uncertainty about the neuronal basis for knowledge representation
      in LLMs, but it is suspected that a significant portion of model capacity is
      used for storing complex categorical and conditional information. The idea is
      to estimate what fraction of LLM parameters are devoted to such standard knowledge,
      as this has not been systematically measured.

      '
